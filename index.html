<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById(id);
const S = 0.014, CX = 553, CY = 500, H = 2.6;          // 1px of the drawing = 1.4cm
const wx = px => (px - CX) * S, wz = py => (py - CY) * S;
const touchMode = matchMedia('(pointer: coarse)').matches || ('ontouchstart' in window && !matchMedia('(hover: hover)').matches);
document.body.classList.toggle('touch', touchMode);

/* ---------------------------------------------------------------- renderer */
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !touchMode, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, touchMode ? 1.5 : 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .85;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd5e6f3, 70, 240);
{ // sky gradient
  const c = document.createElement('canvas'); c.width = 4; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#6fa8dc'); gr.addColorStop(.55, '#bcdcf2'); gr.addColorStop(1, '#eef4f6');
  g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
{ // image-based lighting for realistic reflections / soft fill
  const pm = new THREE.PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = .4;
}
const camera = new THREE.PerspectiveCamera(68, 1, 0.05, 500);
camera.rotation.order = 'YXZ';

/* ---------------------------------------------------------------- textures */
let seed = 7;
const rand = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
function ctex(w, h, draw, rx = 1, ry = rx) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy()); t.repeat.set(rx, ry); return t;

const T = {};
T.tile = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#ebe0c9'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 1500; i++) { g.fillStyle = rand() < .5 ? `rgba(255,255,255,${rand() * .09})` : `rgba(150,128,96,${rand() * .07})`; g.beginPath(); g.arc(rand() * w, rand() * h, rand() * 5 + 1, 0, 7); g.fill(); }
  g.strokeStyle = '#c8baa0'; g.lineWidth = 3; g.strokeRect(0, 0, w, h);
}, 1 / .6);
T.wood = ctex(512, 512, (g, w, h) => {
  const rows = 6, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand() * 200;
    while (x < w) {
      const len = 200 + rand() * 220;
      g.fillStyle = `hsl(${28 + rand() * 6},${40 + rand() * 8}%,${64 + rand() * 8}%)`; g.fillRect(x, r * rh, len, rh);
      for (let i = 0; i < 6; i++) { g.strokeStyle = `rgba(90,55,25,${.05 + rand() * .08})`; g.beginPath(); const yy = r * rh + rand() * rh; g.moveTo(x, yy); g.lineTo(x + len, yy + (rand() - .5) * 4); g.stroke(); }
      g.strokeStyle = 'rgba(60,35,15,.5)'; g.lineWidth = 1.5; g.strokeRect(x, r * rh, len, rh); x += len;
    }
  }
}, 1 / 1.2);
T.deck = ctex(512, 512, (g, w, h) => {
  const rows = 10, rh = h / rows;
  for (let r = 0; r < rows; r++) {
    let x = -rand() * 250;
    while (x < w) {
      const len = 260 + rand() * 250;
      g.fillStyle = `hsl(${27 + rand() * 6},${48 + rand() * 10}%,${46 + rand() * 9}%)`; g.fillRect(x, r * rh, len, rh);
      for (let i = 0; i < 8; i++) { g.strokeStyle = `rgba(70,38,15,${.06 + rand() * .1})`; g.beginPath(); const yy = r * rh + rand() * rh; g.moveTo(x, yy); g.lineTo(x + len, yy + (rand() - .5) * 3); g.stroke(); }
      g.strokeStyle = 'rgba(35,18,6,.7)'; g.lineWidth = 2; g.strokeRect(x, r * rh, len, rh); x += len;
    }
  }
}, 1 / 1.5);
T.mosaic = ctex(256, 256, (g, w, h) => {
  const cols = ['#3fb3b5', '#5cc7c6', '#7fd6d2', '#2c9fa6', '#9be0da', '#49bdbd', '#b9ece6'];
  const n = 16, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = cols[(rand() * cols.length) | 0]; g.fillRect(i * s, j * s, s, s); }
  g.strokeStyle = 'rgba(235,250,248,.85)'; g.lineWidth = 1.2;
  for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke(); g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
}, 1 / .5);
T.conc = ctex(256, 256, (g, w, h) => {
  g.fillStyle = '#c9c9c6'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(${rand() < .5 ? '255,255,255' : '80,80,80'},${rand() * .08})`; g.fillRect(rand() * w, rand() * h, 3, 3); }
  g.strokeStyle = 'rgba(90,90,90,.35)'; g.lineWidth = 2; g.strokeRect(0, 0, w, h);
}, 1 / 1.2);

const mats = {};
function mat(c, r = .8, m = 0, extra = {}) {
  const k = c + '|' + r + '|' + m + '|' + JSON.stringify(extra);
  return mats[k] || (mats[k] = new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, ...extra }));
}
const FLOORMAT = {
  tile: new THREE.MeshStandardMaterial({ map: T.tile, bumpMap: T.tile, bumpScale: 1.2, roughness: .3, envMapIntensity: .9 }),
  wood: new THREE.MeshStandardMaterial({ map: T.wood, bumpMap: T.wood, bumpScale: 1, roughness: .45, envMapIntensity: .8 }),
  deck: new THREE.MeshStandardMaterial({ map: T.deck, bumpMap: T.deck, bumpScale: 2, roughness: .85 }),
  mosaic: new THREE.MeshStandardMaterial({ map: T.mosaic, bumpMap: T.mosaic, bumpScale: 1.5, roughness: .22 }),
  conc: new THREE.MeshStandardMaterial({ map: T.conc, roughness: .9 })
};
const SKIRT = mat(0xffffff, .5), WALL = mat(0xf4f0e9, .92), FRAME = mat(0x3b4046, .5, .3), GLASS = new THREE.MeshPhysicalMaterial({ color: 0xcfe8f5, transparent: true, opacity: .1, roughness: .04, side: THREE.DoubleSide, depthWrite: false });

/* ---------------------------------------------------------------- groups & data */
const world = new THREE.Group(); scene.add(world);
const wallsG = new THREE.Group(), ceilG = new THREE.Group(), furn = new THREE.Group(), floorG = new THREE.Group(), labelsG = new THREE.Group();
world.add(wallsG, ceilG, furn, floorG, labelsG);
const solids = [], floors = [], mapWalls = [], mapFurn = [];

function colRect(x1, y1, x2, y2, tag) { // px rect -> collider (+ minimap)
  solids.push([wx(x1), wz(y1), wx(x2), wz(y2)]);
  if (tag) mapFurn.push([x1, y1, x2, y2]);
}

/* ---------------------------------------------------------------- floors / ceilings */
function addFloor(x1, y1, x2, y2, kind, interior = true) {
  const w = (x2 - x1) * S, d = (y2 - y1) * S;
  const geo = new THREE.PlaneGeometry(w, d); geo.rotateX(-Math.PI / 2); geo.translate(wx((x1 + x2) / 2), 0, wz((y1 + y2) / 2));
  const p = geo.attributes.position, uv = geo.attributes.uv;
  for (let i = 0; i < p.count; i++) uv.setXY(i, p.getX(i), p.getZ(i));
  const m = new THREE.Mesh(geo, FLOORMAT[kind]); m.receiveShadow = true; floorG.add(m);
  const slab = new THREE.Mesh(new THREE.BoxGeometry(w, .3, d), mat(0xb9b6b0, .95)); slab.position.set(wx((x1 + x2) / 2), -.151, wz((y1 + y2) / 2)); slab.receiveShadow = true; floorG.add(slab);
  floors.push({ x1, y1, x2, y2, kind });
  if (interior) {
    const c = new THREE.Mesh(new THREE.BoxGeometry(w, .25, d), mat(0xfbf9f5, .95));
    c.position.set(wx((x1 + x2) / 2), H + .125, wz((y1 + y2) / 2)); c.castShadow = true; c.receiveShadow = true; ceilG.add(c);
  }
}
addFloor(88, 207, 381, 246, 'tile');       // kitchen strip
addFloor(88, 246, 231, 438, 'tile');       // kitchen
addFloor(231, 246, 691, 654, 'tile');      // living + dining + lobby
addFloor(412, 654, 801, 733, 'tile');      // hall
addFloor(697, 404, 801, 654, 'tile');      // corridor
addFloor(801, 207, 1016, 490, 'wood');     // north bedroom
addFloor(803, 490, 1016, 733, 'wood');     // mamad
addFloor(412, 733, 650, 962, 'wood');      // south bedroom
addFloor(650, 733, 912, 962, 'wood');      // parents
addFloor(697, 207, 801, 404, 'mosaic');    // north bath
addFloor(231, 654, 412, 853, 'mosaic');    // main bath
addFloor(912, 733, 1022, 962, 'mosaic');   // ensuite
addFloor(150, 505, 231, 620, 'conc');      // entrance landing
addFloor(231, 853, 412, 962, 'conc', false); // service balcony
addFloor(304, 44, 716, 195, 'deck', false);  // terrace
addFloor(381, 195, 691, 246, 'deck', false);

/* ---------------------------------------------------------------- walls */
function wseg(horiz, c, a, b, y0, y1, tPx, m = WALL, collide = false, cast = true) {
  const len = (b - a) * S, h = y1 - y0; if (len <= .002 || h <= .002) return;
  const me = new THREE.Mesh(new THREE.BoxGeometry(horiz ? len : tPx * S, h, horiz ? tPx * S : len), m);
  const ca = (a + b) / 2;
  me.position.set(horiz ? wx(ca) : wx(c), y0 + h / 2, horiz ? wz(c) : wz(ca));
  me.castShadow = cast; me.receiveShadow = true; wallsG.add(me);
}
function frameOpen(horiz, c, o0, o1, y0, y1) {
  wseg(horiz, c, o0, o1, y0, y0 + .05, 8, FRAME); wseg(horiz, c, o0, o1, y1 - .05, y1, 8, FRAME);
  wseg(horiz, c, o0, o0 + 3, y0, y1, 8, FRAME); wseg(horiz, c, o1 - 3, o1, y0, y1, 8, FRAME);
  const n = Math.max(1, Math.round((o1 - o0) * S / 1.1));
  for (let k = 1; k < n; k++) { const p = o0 + (o1 - o0) * k / n; wseg(horiz, c, p - 1.2, p + 1.2, y0, y1, 8, FRAME); }

}
function addWall(x1, y1, x2, y2, open = [], t = 12) {
  const horiz = y1 === y2, c = horiz ? y1 : x1;
  let a0 = (horiz ? Math.min(x1, x2) : Math.min(y1, y2)) - t / 2, a1 = (horiz ? Math.max(x1, x2) : Math.max(y1, y2)) + t / 2;
  const box = (a, b) => horiz ? [a, c - t / 2, b, c + t / 2] : [c - t / 2, a, c + t / 2, b];
  const solid = (a, b) => { if (b - a < .5) return; wseg(horiz, c, a, b, 0, H, t, WALL, true);
    if (b - a > 14) wseg(horiz, c, a + 5, b - 5, 0, .1, t + 1.6, SKIRT, false, false); colRect(...box(a, b)); mapWalls.push([...box(a, b), 'w']); };

        if (!horiz) lf.position.z = wz(hg); lf.rotation.y = 0; lf.castShadow = true; wallsG.add(lf);

      frameOpen(horiz, c, o0, o1, .9, 2.1); colRect(...box(o0, o1)); mapWalls.push([...box(o0, o1), 'g']);
    } else if (type === 'glass') {
      wseg(horiz, c, o0, o1, 2.4, H, t, WALL); frameOpen(horiz, c, o0, o1, .02, 2.4); colRect(...box(o0, o1)); mapWalls.push([...box(o0, o1), 'g']);

}
function addRail(x1, y1, x2, y2) {

}
const doorLeaf = (hinge, side, col) => ({ leaf: { hinge, side, col } });
addWall(85, 201, 381, 201, [[195, 262, 'window']]);

    composer.addPass(new UnrealBloomPass(new THREE.Vector2(w, h), .14, .7, .93));
    composer.addPass(new OutputPass());
    composer.addPass(new SMAAPass(w * pr, h * pr));
    setHQ(!touchMode);
  } catch (err) { console.warn('post-processing unavailable', err); composer = null; $('bQ').classList.add('hidden'); }
}
function setHQ(on) { hq = on && !!composer; $('bQ').classList.toggle('on', hq); $('bQ').textContent = hq ? '✨ איכות גבוהה: פעיל' : '✨ איכות גבוהה: כבוי'; }
$('bQ').onclick = () => setHQ(!hq);
initPost();
resize(); $('load').remove(); $('start').classList.remove('hidden'); updateHint();
requestAnimationFrame(frame);
window.tour = { teleport, setMode, player, startTour, camera };
</script>
